.content{padding:24px;max-width:1700px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}.pagehead h1{margin:0;font-size:27px;letter-spacing:-.7px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:#fff1f0;color:var(--red);border-color:#ffd2cf}.btn.soft{background:#edf4ff;color:var(--blue);border-color:#d8e6ff}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}.kpi{display:flex;gap:11px;align-items:center}.kpi-icon{width:42px;height:42px;border-radius:12px;background:#e9f1ff;color:var(--blue);display:grid;place-items:center;font-size:19px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:25px;font-weight:800;letter-spacing:-.8px}.delta{font-size:11px;color:var(--green)}.dashgrid{grid-template-columns:1.35fr 1fr .9fr;margin-bottom:14px}.card h2{font-size:16px;margin:0 0 13px;letter-spacing:-.2px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-head h2{margin:0}.chart{height:190px;display:flex;align-items:end;gap:7px;padding:15px 5px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,var(--line) 45px)}.barpair{height:100%;display:flex;align-items:end;gap:3px;flex:1;min-width:4px}.bar{width:50%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#4f8cff,#155eef)}.bar.alt{background:linear-gradient(180deg,#a78bfa,#6d4aff)}.legend{display:flex;gap:12px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.pipeline-list,.source-list,.activity-list,.follow-list{display:grid;gap:11px}.pipeline-row{display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:center}.stage-dot{width:9px;height:9px;border-radius:50%}.muted{color:var(--muted)}.source-row{display:grid;grid-template-columns:80px 1fr 38px;gap:8px;align-items:center;font-size:12px}.track{height:8px;border-radius:99px;background:#edf1f8;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#155eef,#3b82f6)}.lowergrid{grid-template-columns:1.2fr 1fr .9fr}.lead-mini,.activity-item,.follow-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.lead-mini:last-child,.activity-item:last-child,.follow-item:last-child{border-bottom:0}.lead-mini .info,.activity-item .info,.follow-item .info{min-width:0;flex:1}.info strong{display:block;font-size:12px}.info small{display:block;color:var(--muted);font-size:11px}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#eef4ff;color:#175cd3;white-space:nowrap}.pill.green{background:#dcfae6;color:#067647}.pill.red{background:#fee4e2;color:#b42318}.pill.amber{background:#fef0c7;color:#93370d}.pill.purple{background:#f0eaff;color:#6941c6}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:12px}th{background:var(--surface2);color:var(--muted);font-weight:700}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface2)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea,.field-wrap input,.field-wrap select{border:1px solid #d7e0ee;background:var(--surface);color:var(--text);border-radius:8px;padding:10px 11px;min-width:0}.toolbar input{min-width:210px;flex:1}.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700}.field small{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.span2{grid-column:span 2}.span3{grid-column:span 3}.form-section{margin-bottom:18px}.form-section h2{font-size:15px;margin:0 0 13px}.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow:auto;padding-bottom:8px}.kan-col{background:#eef3fa;border:1px solid #e1e9f5;border-radius:12px;padding:10px;min-height:320px}.kan-head{display:flex;justify-content:space-between;font-weight:800;font-size:12px;padding:5px 2px 12px}.deal-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;box-shadow:0 2px 6px #102b5008}.deal-card strong{display:block;font-size:12px}.deal-card small{display:block;color:var(--muted);margin:4px 0 9px}.deal-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px}.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:15px}.tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.notice{padding:12px 14px;border-radius:10px;background:#fff7e6;border:1px solid #fedf89;color:#93370d;margin-bottom:14px}.successbox{padding:12px;border-radius:10px;background:#ecfdf3;border:1px solid #abefc6;color:#067647}.steps{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}.step{padding:8px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}.step.active{background:#edf4ff;border-color:#b2ccff;color:#1849a9}.empty{text-align:center;padding:42px 20px;color:var(--muted)}.empty .big{font-size:32px;margin-bottom:8px}.settings-layout{display:grid;grid-template-columns:210px 1fr;gap:16px}.settings-nav{display:grid;align-content:start;gap:4px}.settings-nav button{text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted)}.settings-nav button.active{background:#edf4ff;color:var(--blue);font-weight:700}.switch{width:36px;height:20px;border-radius:99px;background:#b7c2d4;display:inline-block;position:relative;vertical-align:middle}.switch:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%}.switch.on{background:var(--blue)}.switch.on:after{left:19px}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#10213e;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 12px 30px #0003;z-index:30}.modal-backdrop{position:fixed;inset:0;background:#0b173b80;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:470px;width:100%;box-shadow:0 20px 70px #07142c55}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.mobile-menu{display:none}
body.dark{--bg:#081222;--surface:#101e33;--surface2:#14243b;--text:#edf3ff;--muted:#a2b2cc;--line:#263852;--shadow:0 6px 24px #0002}body.dark .topbar{background:#0e1b2f}body.dark .kpi-icon{background:#172f55}body.dark .kan-col{background:#0d1a2d;border-color:#263852}body.dark .toolbar input,body.dark .toolbar select,body.dark .field input,body.dark .field select,body.dark .field textarea{border-color:#34445c}body.dark .track{background:#263852}body.dark .btn:not(.primary):not(.danger){background:#14243b;color:var(--text);border-color:#2a3d59}body.dark .pill{filter:saturate(.8)}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dashgrid{grid-template-columns:1fr 1fr}.dashgrid .card:last-child{grid-column:span 2}.lowergrid{grid-template-columns:1fr 1fr}.lowergrid .card:last-child{grid-column:span 2}.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:span 2}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:15;inset:0 auto 0 0;width:260px;overflow:auto}.mobile-menu{display:inline-block}.topbar{padding:0 12px;height:60px}.top-actions .profile span{display:none}.content{padding:15px}.pagehead{display:block}.pagehead .actions{margin-top:12px}.dashgrid,.lowergrid{grid-template-columns:1fr}.dashgrid .card:last-child,.lowergrid .card:last-child{grid-column:auto}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-layout{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.top-actions .date-action{display:none}}
@media(max-width:440px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpis .card{padding:11px}.kpi{display:block}.kpi-icon{margin-bottom:8px}.kpi .value{font-size:21px}.content{padding:10px}.pagehead h1{font-size:23px}.topbar .search input{padding-left:32px}.top-actions{gap:5px}.top-actions button{padding:8px}.hide-mobile{display:none}.card{padding:12px}}
@media(max-width:820px){.content>.grid[style*="repeat(3"]{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">O</div><div><strong>OneClick Automics</strong><small>CRM + WhatsApp Lead Management</small></div></div>
  <button class="workspace" onclick="toast('Workspace selector: connect to tenant/workspace API')">▦ &nbsp; Bring My Bite <small>Workspace ▾</small></button>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button><button data-page="onboarding"><span class="ico">✦</span>Getting Started</button><button data-page="coverage"><span class="ico">☑</span>UI Coverage Audit</button><button data-page="auth"><span class="ico">♙</span>Login & Recovery</button>
    <button data-page="leads"><span class="ico">▤</span>Lead Inbox <span class="count">24</span></button>
    <button data-page="pipeline"><span class="ico">▥</span>Sales Pipeline</button>
    <button data-page="followups"><span class="ico">◷</span>Follow-ups <span class="count">12</span></button>
    <button data-page="contacts"><span class="ico">♙</span>Contacts & Companies</button>
    <button data-page="reports"><span class="ico">▧</span>Reports & Analytics</button>
    <button data-page="whatsapp"><span class="ico">◉</span>WhatsApp Inbox</button>
    <button data-page="integrations"><span class="ico">⌘</span>Integrations</button>
    <button data-page="importexport"><span class="ico">⇅</span>Import / Export</button>
    <button data-page="team"><span class="ico">♧</span>Team & Permissions</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
    <button data-page="audit"><span class="ico">▣</span>Audit Log</button>
  </nav>
  <div class="sidebar-foot"><div class="upgrade"><strong>✦ Upgrade Plan</strong><p>More leads, features and higher limits.</p><button onclick="toast('Plan upgrade requires billing integration')">Explore plans</button></div><div class="user"><div class="avatar">RS</div><div><strong>Rohan Singh</strong><small>Workspace Admin</small></div></div></div>
</aside>
<main>
<header class="topbar">
  <button class="icon-btn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div class="search"><input id="globalSearch" placeholder="Search leads, contacts, companies…  (Ctrl K)" onkeydown="if(event.key==='Enter'){go('leads');document.getElementById('leadSearch').value=this.value;renderLeads()}"></div>
  <div class="top-actions"><button class="date-action" onclick="toast('Date range picker: choose range in production')">▦ &nbsp; Oct 1–31, 2026 ▾</button><button onclick="toast('3 notifications in this sample workspace')">♧ <span class="pill red">3</span></button><button onclick="document.body.classList.toggle('dark')">☼</button><div class="profile"><div class="avatar">RS</div><span><strong>Rohan Singh</strong><small>Admin</small></span></div></div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>

{id:5,name:"Rahul Verma",company:"Verma & Co.",phone:"+91 98765 43216",email:"rahul@verma.in",source:"Website",stage:"Won",owner:"Vivek Arora",value:210000,next:"—",last:"2 hours ago",qualification:"Qualified",consent:"Consented",action:"Onboarding",notes:"Deal won; onboarding next."},
{id:6,name:"Sneha Iyer",company:"Iyer Solutions",phone:"+91 98765 43215",email:"sneha@iyer.in",source:"Direct",stage:"Lost",owner:"Neha Verma",value:65000,next:"—",last:"Yesterday",qualification:"Not Qualified",consent:"Opted out",action:"—",notes:"Not a fit at this time."}
];

let currentPage="dashboard", editingId=null, emptyDashboardMode=false;
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
function toast(msg){const root=document.getElementById("toastRoot");root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>root.innerHTML="",3000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pill(stage){let c=stage==="Won"?"green":stage==="Lost"?"red":stage==="Proposal"?"amber":stage==="Qualified"?"purple":"";return `<span class="pill ${c}">${esc(stage)}</span>`}
function head(title,sub,actions=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function btn(text,action,cls=""){return `<button class="btn ${cls}" onclick="${action}">${text}</button>`}
function card(title,body,extra=""){return `<section class="card ${extra}"><h2>${title}</h2>${body}</section>`}
function go(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("sidebar").classList.remove("open");render()}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function render(){const root=document.getElementById("content");const views={dashboard,onboarding,coverage,auth:loginPage,leads:leadInbox,pipeline,followups,contacts,reports,whatsapp,integrations,importexport,team,settings,audit};root.innerHTML=(views[currentPage]||dashboard)()}
function dashboard(){

let bars=Array.from({length:24},(_,i)=>`<div class="barpair"><div class="bar" style="height:${18+((i*17+9)%67)}%"></div><div class="bar alt" style="height:${12+((i*11+7)%48)}%"></div></div>`).join("");
let stageHtml=stages.map(s=>`<div class="pipeline-row"><span class="stage-dot" style="background:${colors[s]}"></span><span>${s}</span><strong>${({"New":78,"Contacted":64,"Qualified":52,"Proposal":32,"Won":16,"Lost":6})[s]}</strong></div>`).join("");
let source=[["Website",32],["WhatsApp",24],["Google Ads",16],["Referral",12],["Direct",8],["Other",6]].map(s=>`<div class="source-row"><span>${s[0]}</span><div class="track"><div class="fill" style="width:${s[1]*2.7}%"></div></div><strong>${s[1]}%</strong></div>`).join("");
return head("Dashboard","Your sales overview for Oct 1 – Oct 31, 2026.",btn("Preview empty dashboard","emptyDashboardMode=!emptyDashboardMode;render()")+btn("Getting Started","go('onboarding')","soft")+btn("+ Add Lead","openLeadForm()","primary"))+ (emptyDashboardMode?emptyDashboard():`<div class="grid kpis">${k}</div><div class="grid dashgrid">
<section class="card"><div class="card-head"><h2>Leads Trend</h2><span class="legend"><span><i class="dot" style="background:#155eef"></i>New</span><span><i class="dot" style="background:#7a5af8"></i>Qualified</span></span></div><div class="chart">${bars}</div><div class="sub">Oct 1 &nbsp;&nbsp; Oct 7 &nbsp;&nbsp; Oct 14 &nbsp;&nbsp; Oct 21 &nbsp;&nbsp; Oct 31</div></section>
<section class="card"><h2>Pipeline Overview <small class="muted">(Current: 248 leads)</small></h2><div style="display:flex;gap:18px;align-items:center"><div style="width:140px;height:140px;flex:0 0 140px;border-radius:50%;background:conic-gradient(#155eef 0 31%,#2e90fa 31% 57%,#7a5af8 57% 78%,#f79009 78% 91%,#12b76a 91% 97%,#f04438 97%);display:grid;place-items:center"><div style="background:var(--surface);border-radius:50%;width:82px;height:82px;display:grid;place-content:center;text-align:center;font-size:22px;font-weight:800">248<small style="font-size:10px;font-weight:400">Total leads</small></div></div><div class="pipeline-list" style="flex:1">${stageHtml}</div></div></section>
<section class="card"><h2>Leads by Source</h2><div class="source-list">${source}</div><div class="sub" style="margin-top:12px">Click a source in Reports to drill into records.</div></section></div>

t / Save as PDF","window.print()"))+`<div class="notice"><strong>Important:</strong> This is a coverage checklist. Authentication, persistence, email delivery, permissions, and provider integrations still require backend implementation and QA verification.</div>`+Object.entries(groups).map(([title,items])=>`<section class="card" style="margin-bottom:14px"><h2>${title}</h2>${items.map(x=>`<label class="lead-mini" style="cursor:pointer"><input type="checkbox"><span class="info"><strong>${x}</strong><small>${title.includes("P0")?"Critical before launch":"Required for complete product coverage"}</small></span></label>`).join("")}</section>`).join("")+`<section class="card"><h2>Dropdown inventory — currently represented in prototype</h2><div class="tablewrap"><table><thead><tr><th>Page</th><th>Dropdown</th><th>Options / purpose</th><th>Limitation</th></tr></thead><tbody>${[["Lead Inbox","Source","Website, WhatsApp, Google Ads, Referral, Direct","Other option/filter wiring incomplete"],["Lead Inbox","Stage","New, Contacted, Qualified, Proposal, Won, Lost","Sample data only"],["Lead Inbox","Owner","Sample owners","Should be API-driven"],["Lead form","Qualification","Not Qualified, In Review, Qualified","No server rules"],["Lead form","Source","Website, WhatsApp, Google Ads, Referral, Direct, Other","Config persistence needed"],["Lead form","Stage","All six stages","Transition policy not enforced"],["Lead form","Next action","Call, email, proposal, meeting, WhatsApp, demo, onboarding, none","Task linking needs backend"],["Lead form","Consent","Unknown, Consented, Opted out","Must enforce at send layer"],["Follow-ups","Owner / task type","Owners; Call, Email, Meeting, WhatsApp","Demo-level filters"],["Reports","Period / owner / source","Date period, owner and source","Not wired to real data"],["Team","Role","Admin, Manager, Executive, Read-only","Server-side RBAC required"],["Settings","Currency / timezone / date / theme / week start","INR/USD; timezone; date formats; Light/Dark; Monday/Sunday","Persistence and full timezone list needed"],["Integrations","Destination stage","Pipeline stages","Save/test requires backend"],["Export","Scope / format / fields","Filtered/selected/all; CSV; field selection","File generation not implemented"]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`}

`<section class="card"><div class="toolbar"><input id="leadSearch" placeholder="Search name, company, phone or email…" oninput="renderLeadRows()"><select id="sourceFilter" onchange="renderLeadRows()"><option value="">All sources</option>${["Website","WhatsApp","Google Ads","Referral","Direct"].map(s=>`<option>${s}</option>`).join("")}</select><select id="stageFilter" onchange="renderLeadRows()"><option value="">All stages</option>${stages.map(s=>`<option>${s}</option>`).join("")}</select><select id="ownerFilter" onchange="renderLeadRows()"><option value="">All owners</option>${[...new Set(leads.map(l=>l.owner))].map(s=>`<option>${s}</option>`).join("")}</select><button class="btn" onclick="toast('Advanced filters are a prototype placeholder')">More Filters</button></div><div class="toolbar"><label><input type="checkbox" id="selectAll" onchange="document.querySelectorAll('.leadcheck').forEach(c=>c.checked=this.checked)"> Select all visible</label><button class="btn" onclick="bulkAction('Assign')">Bulk assign</button><button class="btn" onclick="bulkAction('Change stage')">Change stage</button><button class="btn" onclick="openExport()">Export selected</button><button class="btn danger" onclick="bulkAction('Delete')">Delete selected</button><span class="sub" id="leadCount"></span></div><div class="tablewrap"><table><thead><tr><th></th><th>Lead / Company</th><th>Phone</th><th>Email</th><th>Source</th><th>Stage</th><th>Owner</th><th>Deal value</th><th>Next follow-up</th><th>Last activity</th><th>Actions</th></tr></thead><tbody id="leadRows"></tbody></table></div><div class="toolbar" style="justify-content:space-between;margin-top:12px"><span class="sub" id="paginationText">Showing records</span><div>${btn("Previous","toast('Previous page')")}${btn("1","toast('Page 1 selected')","soft")}${btn("2","toast('Page 2 selected')")}${btn("Next","toast('Next page')")}</div></div></section>`
}
function renderLeadRows(){
const q=(document.getElementById("leadSearch")?.value||"").toLowerCase(),s=document.getElementById("sourceFilter")?.value||"",st=document.getElementById("stageFilter")?.value||"",o=document.getElementById("ownerFilter")?.value||"";
const rows=leads.filter(l=>(!q||[l.name,l.company,l.phone,l.email].join(" ").toLowerCase().includes(q))&&(!s||l.source===s)&&(!st||l.stage===st)&&(!o||l.owner===o));
const body=document.getElementById("leadRows");if(!body)return;
body.innerHTML=rows.length?rows.map(l=>`<tr><td><input type="checkbox" class="leadcheck" value="${l.id}"></td><td><strong>${l.name}</strong><br><span class="muted">${l.company}</span></td><td>${l.phone}</td><td>${l.email}</td><td>${l.source}</td><td>${pill(l.stage)}</td><td>${l.owner}</td><td>${money(l.value)}</td><td>${l.next}</td><td>${l.last}</td><td><button class="btn" onclick="openLeadDetail(${l.id})">View</button> <button class="btn" onclick="openLeadForm(${l.id})">Edit</button></td></tr>`).join(""):`<tr><td colspan="11"><div class="empty"><div class="big">⌕</div><strong>No leads found</strong><p>Try changing your search or filters.</p><button class="btn" onclick="document.getElementById('leadSearch').value='';document.getElementById('sourceFilter').value='';document.getElementById('stageFilter').value='';document.getElementById('ownerFilter').value='';renderLeadRows()">Clear filters</button></div></td></tr>`;
document.getElementById("leadCount").textContent=`${rows.length} matching records`;document.getElementById("paginationText").textContent=`Showing ${rows.length?1:0}–${rows.length} of ${rows.length} matching sample leads`;
}
function openLeadForm(id=null){
editingId=id;const l=leads.find(x=>x.id===id)||{name:"",company:"",phone:"+91 ",email:"",source:"Website",stage:"New",owner:"Riya Singh",value:"",qualification:"Not Qualified",consent:"Unknown",action:"Call",next:"",notes:""};
document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:850px;max-height:92vh;overflow:auto"><div class="card-head"><div><h2>${id?"Edit Lead":"Add New Lead"}</h2><div class="sub">Fields marked * are required in this prototype; final mandatory rules require product approval.</div></div><button class="btn" onclick="closeModal()">✕</button></div><form id="leadForm" onsubmit="saveLead(event)"><div class="form-section"><h2>Lead information</h2><div class="field-grid"><div class="field"><label>Lead name *</label><input name="name" required value="${esc(l.name)}"></div><div class="field"><label>Phone *</label><input name="phone" required value="${esc(l.phone)}"></div><div class="field"><label>Email</label><input type="email" name="email" value="${esc(l.email)}"></div><div class="field"><label>Company</label><input name="company" value="${esc(l.company)}"></div><div class="field"><label>Lead source</label><select name="source">${["Website","WhatsApp","Google Ads","Referral","Direct","Other"].map(s=>`<option ${l.source===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Creation timestamp</label><input value="${id?"Original creation timestamp preserved":"Generated on save"}" disabled></div></div></div><div class="form-section"><h2>Sales & follow-up</h2><div class="field-grid"><div class="field"><label>Assigned owner</label><select name="owner">${["Riya Singh","Vivek Arora","Ankit Jain","Neha Verma","Amit Kumar"].map(s=>`<option ${l.owner===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Pipeline stage</label><select name="stage">${stages.map(s=>`<option ${l.stage===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Qualification status</label><select name="qualification">${["Not Qualified","In Review","Qualified"].map(s=>`<option ${l.qualification===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Deal value (INR)</label><input name="value" type="number" min="0" value="${esc(l.value)}"></div><div class="field"><label>Next action</label><select name="action">${["Call","Send email","Send proposal","Meeting","WhatsApp follow-up","Demo","Onboarding","None"].map(s=>`<option ${l.action===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Follow-up date/time</label><input name="next" placeholder="e.g. 2026-10-22 11:30 AM" value="${esc(l.next==="—"?"":l.next)}"></div><div class="field"><label>Consent / opt-out status</label><select name="consent">${["Unknown","Consented","Opted out"].map(s=>`<option ${l.consent===s?"selected":""}>${s}</option>`).join("")}</select><small>Do not message opted-out contacts.</small></div><div class="field span2"><label>Notes</label><textarea name="notes">${esc(l.notes)}</textarea></div></div></div><div id="duplicateHint"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn" onclick="checkDuplicate()">Check duplicates</button><button type="submit" class="btn primary">Save Lead</button></div></form></div></div>`;
}
function checkDuplicate(){const f=new FormData(document.getElementById("leadForm"));const phone=f.get("phone");const email=f.get("email");const match=leads.find(l=>l.id!==editingId&&(l.phone===phone||(email&&l.email.toLowerCase()===email.toLowerCase())));document.getElementById("duplicateHint").innerHTML=match?`<div class="notice">Possible duplicate: <strong>${match.name}</strong> (${match.phone}). <button type="button" class="btn" onclick="closeModal();openLeadDetail(${match.id})">View existing</button></div>`:`<div class="successbox">No duplicate found in the current sample records. This is a local prototype check only.</div>`}
function saveLead(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());const duplicate=leads.find(l=>l.id!==editingId&&(l.phone===f.phone||(f.email&&l.email.toLowerCase()===f.email.toLowerCase())));if(duplicate){document.getElementById("duplicateHint").innerHTML=`<div class="notice">Possible duplicate found: ${duplicate.name}. Review the existing record before saving.</div>`;return}if(editingId){Object.assign(leads.find(l=>l.id===editingId),f)}else{leads.unshift({...f,id:Math.max(...leads.map(l=>l.id))+1,last:"Just now"})}closeModal();toast(editingId?"Lead updated in prototype":"Lead created in prototype");render()}

function bulkAction(action){const ids=[...document.querySelectorAll(".leadcheck:checked")].map(x=>+x.value);if(!ids.length){toast("Select at least one lead first");return}if(action==="Delete"){confirmAction(`Delete ${ids.length} selected sample lead(s)?`,()=>{ids.forEach(id=>{const i=leads.findIndex(l=>l.id===id);if(i>=0)leads.splice(i,1)});render();toast("Selected sample leads deleted")})}else toast(`${action}: ${ids.length} selected. Connect backend to apply safely.`)}

function recoveryPage(mode="request"){const root=document.getElementById("content");const views={request:`<h2>Forgot password?</h2><p class="sub">Enter your email. For privacy, the response should not reveal whether an account exists.</p><div class="field"><label>Email address *</label><input id="recoveryEmail" type="email" required placeholder="you@company.com"></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="recoveryPage('sent')">Send reset link</button></div>`,sent:`<div class="empty"><div class="big">✉</div><h2>Check your email</h2><p>If an account matches that address, reset instructions will be sent.</p><button class="btn" onclick="recoveryPage('request')">Try another email</button></div>`,expired:`<div class="notice">This reset link has expired or is invalid. Request a new link to continue.</div><button class="btn primary" onclick="recoveryPage('request')">Request new link</button>`,reset:`<h2>Create a new password</h2><div class="field"><label>New password *</label><input id="newPassword" type="password" minlength="12" placeholder="At least 12 characters"></div><div class="field" style="margin-top:12px"><label>Confirm new password *</label><input id="confirmPassword" type="password" minlength="12" placeholder="Repeat password"></div><button class="btn primary" style="margin-top:14px" onclick="const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<12){toast('Use at least 12 characters')}else if(a!==b){toast('Passwords do not match')}else{recoveryPage('updated')}">Update password</button>`,updated:`<div class="successbox"><strong>Password updated in prototype state.</strong><p>Real password changes require server-side token validation and secure credential storage.</p></div><button class="btn primary" onclick="document.getElementById('content').innerHTML=loginPage()">Return to sign in</button>`};root.innerHTML=`${head("Account Recovery","Password reset and account recovery states.")}<section class="card" style="max-width:600px">${views[mode]||views.request}<div class="tabs" style="margin-top:18px"><button onclick="recoveryPage('request')">Request link</button><button onclick="recoveryPage('expired')">Expired link</button><button onclick="recoveryPage('reset')">Reset password</button></div></section>`}
