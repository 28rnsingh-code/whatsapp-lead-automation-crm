name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/database-safety-guards]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneclick_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oneclick_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneclick_crm_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneclick_crm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend build
        run: npm run build:server

      - name: Frontend build
        run: npm run build:client

      - name: Apply migrations to isolated test database
        run: npm run migrate

      - name: Seed isolated test database
        run: npx ts-node src/db/seed.ts
        working-directory: server

      - name: Backend tests
        run: npm test
