
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/database-safety-guards]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend build
        run: npm run build:server

      - name: Frontend build
        run: npm run build:client

      - name: Backend tests
        run: npm test
